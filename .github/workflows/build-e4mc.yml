name: Build e4mc Bedrock Bridge

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Build mod
        working-directory: e4mc-bedrock-bridge
        run: ./gradlew build --no-daemon
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: e4mc-bedrock-bridge
          path: e4mc-bedrock-bridge/build/libs/*.jar
          if-no-files-found: error
